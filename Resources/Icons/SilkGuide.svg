<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Dedicated `Silk_Guide` icon (#94: its OWN file, never the workbench's
       `Silk.svg`; art replaced with the owner's new workflow family,
       2026-10-25). Same family as the four workflow icons beside it
       (`SilkEdge.svg` / `SilkPatch.svg` / `SilkBlend.svg` / `SilkCorner.svg`):
       NO tile, dark strokes on a transparent background, so it reads on a
       light AND a dark theme.
       Picture: a wand (the "guide me" mark) with the sparks it leaves
       behind, so the button that opens the wizard is recognisably the wand
       that walks the user through the four steps.
       Palette of the new four: teal #176b60, amber #b57908, pink #f48fb1. -->
  <!-- the wand: a tapered stick, handle low-left, tip up-right -->
  <path d="M13.18 57.18 L47.41 19.41 L44.59 16.59 L6.82 50.82 Z"
        fill="#176b60" stroke="#176b60" stroke-width="1.5"
        stroke-linejoin="round"/>
  <!-- the amber tip the wand works with -->
  <path d="M33.94 26.10 L37.90 30.06 L43.99 23.19 L40.81 20.01 Z"
        fill="#b57908"/>
  <!-- the sparks, ascending towards the tip -->
  <path d="M 33.00 7.50 C 33.00 10.23 33.77 11.00 36.50 11.00 C 33.77 11.00 33.00 11.77 33.00 14.50 C 33.00 11.77 32.23 11.00 29.50 11.00 C 32.23 11.00 33.00 10.23 33.00 7.50 Z"
        fill="#f48fb1"/>
  <path d="M 57.00 27.50 C 57.00 31.01 57.99 32.00 61.50 32.00 C 57.99 32.00 57.00 32.99 57.00 36.50 C 57.00 32.99 56.01 32.00 52.50 32.00 C 56.01 32.00 57.00 31.01 57.00 27.50 Z"
        fill="#176b60"/>
  <path d="M 48.00 6.50 C 48.00 13.13 49.87 15.00 56.50 15.00 C 49.87 15.00 48.00 16.87 48.00 23.50 C 48.00 16.87 46.13 15.00 39.50 15.00 C 46.13 15.00 48.00 13.13 48.00 6.50 Z"
        fill="#b57908"/>
</svg>
